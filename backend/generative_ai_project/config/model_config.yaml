# ═══════════════════════════════════════════════════════════════
# Model Configuration — Fully Open-Source / Self-Hosted
# Default backend is CPU-safe (transformers). Switch via MODEL_BACKEND
# env var to "ollama" (recommended on CPU-only VMs) or "unsloth" (GPU).
# ═══════════════════════════════════════════════════════════════

# ── Active Provider ─────────────────────────────────────────
# Overridden by MODEL_BACKEND env var at runtime.
active_provider: "transformers"

# ── Provider Configurations ─────────────────────────────────
providers:
  # CPU-safe default. Uses HuggingFace transformers directly so the API
  # can start on plain CPU-only VMs without CUDA / Unsloth.
  transformers:
    model_id: "google/gemma-3-4b-it"
    device: null                    # null = auto (cuda if available, else cpu)
    torch_dtype: null               # null = auto (fp16 on cuda, fp32 on cpu)
    load_in_4bit: false             # only honored on cuda
    trust_remote_code: false
    generation_config:
      temperature: 0.10
      top_p: 0.80
      top_k: 30
      max_output_tokens: 2048
      max_seq_length: 4096
    supports_tools: false
    supports_structured_output: true

  unsloth:
    model_id_env: "UNSLOTH_MODEL_ID"
    model_id: "unsloth/gemma-4-31b-it-bnb-4bit"
    max_seq_length_env: "UNSLOTH_MAX_SEQ_LENGTH"
    load_in_4bit_env: "UNSLOTH_LOAD_IN_4BIT"
    dtype_env: "UNSLOTH_DTYPE"
    hf_token_env: "HF_TOKEN"
    load_in_4bit: true
    dtype: null
    generation_config:
      temperature: 0.10
      top_p: 0.80
      top_k: 30
      max_output_tokens: 4096
      max_seq_length: 8192
    supports_tools: false
    supports_structured_output: true

  ollama:
    base_url_env: "OLLAMA_BASE_URL"
    base_url_default: "http://localhost:11434"
    model_id: "gemma4:31b"
    generation_config:
      temperature: 0.10          # Very low for deterministic reasoning
      top_p: 0.80
      top_k: 30
      max_output_tokens: 4096
      num_ctx: 8192              # Context window size
      repeat_penalty: 1.1
    # Ollama-native tool/function calling
    supports_tools: true
    supports_structured_output: true

  ollama_large:
    base_url_env: "OLLAMA_BASE_URL"
    base_url_default: "http://localhost:11434"
    model_id: "gemma4:31b"
    generation_config:
      temperature: 0.10
      top_p: 0.80
      top_k: 30
      max_output_tokens: 8192
      num_ctx: 16384

# ── Embedding Configuration (Open-Source, Multilingual) ─────
embedding:
  model_name: "BAAI/bge-m3"      # Multilingual: English, Urdu, Roman Urdu
  dimensions: 1024
  batch_size: 128
  normalize: true
  device: "cpu"                   # "cuda" if GPU available

# ── Reranking Configuration (Open-Source) ───────────────────
reranking:
  enabled: true
  model_name: "BAAI/bge-reranker-base"
  top_k_input: 50                 # candidates from vector search
  top_n_output: 10                # output after reranking
  device: "cpu"

# ── Streaming ───────────────────────────────────────────────
streaming:
  enabled: true
  chunk_size: 32

# ── Inference Tuning ────────────────────────────────────────
inference:
  max_reasoning_steps: 6
  confidence_threshold: 0.70
  timeout_seconds: 60             # higher for local model
  retry_count: 2
  retry_delay_ms: 1000

# ── ADK V2 Integration ─────────────────────────────────────
adk:
  enabled: true
  model_string: "unsloth_inprocess"
  agent_framework: "google-adk"
