# ═══════════════════════════════════════════════════════════════
# Fine-Tuning Configuration — LoRA / QLoRA for Gemma 4
# ═══════════════════════════════════════════════════════════════

# ── Base Model ──────────────────────────────────────────────
base_model:
  name: "google/gemma-4-31B-it"
  quantization: "4bit"            # QLoRA for memory efficiency
  torch_dtype: "bfloat16"

# ── LoRA Configuration ─────────────────────────────────────
lora:
  r: 16                           # Rank — balance between capacity and memory
  lora_alpha: 32                  # Scaling factor
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

# ── Training Hyperparameters ───────────────────────────────
training:
  output_dir: "data/fine_tuned/lora_adapter"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_steps: 100
  max_seq_length: 2048
  logging_steps: 10
  save_steps: 200
  fp16: false
  bf16: true

# ── Dataset ────────────────────────────────────────────────
dataset:
  train_file: "data/fine_tuned/training_data.jsonl"
  validation_split: 0.1
  format: "instruction"           # instruction-response pairs
  max_samples: null               # null = use all

# ── Adapter Deployment ─────────────────────────────────────
adapter:
  path: "data/fine_tuned/lora_adapter"
  auto_load: false                # Set true after training
  merge_on_load: false            # Keep as adapter for hot-swap
